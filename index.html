<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance System</title>
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: white;
            transition: opacity 0.3s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-btn {
            background-color: #4CAF50;
        }

        .logout-btn {
            background-color: #f44336;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        #records {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }

        .success {
            background-color: #e8f5e9;
            color: #4CAF50;
        }

        .error {
            background-color: #ffebee;
            color: #f44336;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        .record-count {
            text-align: right;
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }

        #loadingIndicator {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Attendance System</h1>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="tasks">Today's Tasks:</label>
            <textarea id="tasks" placeholder="Enter your tasks for today"></textarea>
        </div>
        
        <div class="buttons">
            <button id="punchInBtn" class="login-btn" onclick="markAttendance('IN')" disabled>Punch In</button>
            <button id="punchOutBtn" class="logout-btn" onclick="markAttendance('OUT')" disabled>Punch Out</button>
        </div>
        
        <div id="message" class="message"></div>
        <div id="loadingIndicator">Initializing...</div>
        
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Name</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Tasks</th>
                </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
        </table>
        <div class="record-count" id="recordCount"></div>
    </div>

    <script>
        // Configuration
        const SPREADSHEET_ID = '1MgTR-nErhInDloyh79sf7L6rdCs9opVSLlPGNiTfLeQ';
        const API_KEY = 'AIzaSyDVfbeM2rmEUnQ4Pzm0SFiR5YXjo7VufKc';
        const SHEET_NAME = 'Attendance';
        
        // Global variables
        let isApiReady = false;
        
        // Initialize the application
        function initApp() {
            gapi.load('client', initClient);
        }

        // Initialize Google Sheets API client
        async function initClient() {
            try {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4']
                });
                
                isApiReady = true;
                enableButtons();
                hideLoadingIndicator();
                await loadAttendanceRecords();
                
                console.log('Google Sheets API initialized successfully');
            } catch (error) {
                console.error('Error initializing API:', error);
                showMessage('Error initializing API. Please check your internet connection and reload the page.', 'error');
                hideLoadingIndicator();
            }
        }

        // Enable/disable buttons based on form validation
        function validateForm() {
            const email = document.getElementById('email').value.trim();
            const name = document.getElementById('name').value.trim();
            const isValid = email && name && isApiReady;
            
            document.getElementById('punchInBtn').disabled = !isValid;
            document.getElementById('punchOutBtn').disabled = !isValid;
        }

        // Enable buttons when API is ready
        function enableButtons() {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('input', validateForm);
            });
            validateForm();
        }

        // Hide loading indicator
        function hideLoadingIndicator() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }

        // Mark attendance (Punch In/Out)
        async function markAttendance(type) {
            if (!isApiReady) {
                showMessage('Please wait for system initialization...', 'error');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const name = document.getElementById('name').value.trim();
            const tasks = document.getElementById('tasks').value.trim();

            if (!email || !name) {
                showMessage('Please enter your email and name', 'error');
                return;
            }

            if (type === 'IN' && !tasks) {
                showMessage('Please enter your tasks for today', 'error');
                return;
            }

            try {
                const currentTime = new Date();
                const record = [
                    email,
                    name,
                    currentTime.toLocaleDateString(),
                    currentTime.toLocaleTimeString(),
                    type,
                    tasks
                ];

                await appendToSheet(record);
                showMessage(`Punch ${type} recorded successfully!`, 'success');
                await loadAttendanceRecords();

                if (type === 'OUT') {
                    document.getElementById('tasks').value = '';
                }
            } catch (error) {
                showMessage('Error recording attendance. Please try again.', 'error');
                console.error('Error:', error);
            }
        }

        // Append record to Google Sheet
        async function appendToSheet(record) {
            try {
                const response = await gapi.client.sheets.spreadsheets.values.append({
                    spreadsheetId: SPREADSHEET_ID,
                    range: `${SHEET_NAME}!A:F`,
                    valueInputOption: 'USER_ENTERED',
                    insertDataOption: 'INSERT_ROWS',
                    resource: {
                        values: [record]
                    }
                });
                
                if (response.status !== 200) {
                    throw new Error('Failed to append data to sheet');
                }
            } catch (error) {
                console.error('Error appending to sheet:', error);
                throw error;
            }
        }

        // Load attendance records
        async function loadAttendanceRecords() {
            try {
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: `${SHEET_NAME}!A:F`
                });

                const records = response.result.values || [];
                updateDisplay(records);
            } catch (error) {
                showMessage('Error loading records', 'error');
                console.error('Error loading records:', error);
            }
        }

        // Update the display with records
        function updateDisplay(records) {
            const tbody = document.getElementById('recordsBody');
            tbody.innerHTML = '';

            // Display records in reverse chronological order (newest first)
            records.slice(1).reverse().forEach(record => {
                const row = tbody.insertRow();
                record.forEach(cell => {
                    const td = row.insertCell();
                    td.textContent = cell || '';
                });
            });

            document.getElementById('recordCount').textContent = 
                `Total Records: ${Math.max(0, records.length - 1)}`;
        }

        // Show message with type (success/error)
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Add event listener for page load
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
